[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cardiowave-lab"
version = "0.2.0"
description = "Synthetic ECG-like waveform classification and robustness research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","scipy>=1.10","scikit-learn>=1.3","torch>=2.1","matplotlib>=3.7","joblib>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
